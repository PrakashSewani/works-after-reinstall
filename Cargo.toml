[package]
name = "works-after-reinstall"
version = "0.1.0"
edition = "2024"
description = "Your Windows setup, rebuilt after every reinstall."
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
winapi = { version = "0.3.9", features = [
    "handleapi",
    "minwindef",
    "ntdef",
    "processthreadsapi",
    "securitybaseapi",
    "winnt",
    "winuser",
] }
winreg = "0.56.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
